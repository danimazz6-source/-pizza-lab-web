<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Lab — Tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#2B2622;
    --cream:#FBF7F0;
    --cream-2:#F3ECDF;
    --red:#E13A3A;
    --red-dark:#B72A2A;
    --green:#3D7A4F;
    --amber:#B7791F;
    --grey-mid:#8C8177;
    --line:#E7DECD;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--charcoal); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px; margin:0 auto; padding:60px 24px 80px; text-align:center;}
  h1,h2,.display{font-family:'Archivo', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit; text-decoration:none;}

  .logo{display:flex; align-items:center; justify-content:center; gap:11px; font-size:17px; font-weight:800; margin-bottom:52px;}
  .mark{width:34px; height:34px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mark svg{width:19px; height:19px;}

  .icon{
    width:76px; height:76px; border-radius:50%; margin:0 auto 26px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon.ok{background:var(--green);}
  .icon.fail{background:var(--red);}
  .icon.pending{background:var(--amber);}

  h1{font-size:clamp(26px,4vw,34px); font-weight:800; letter-spacing:-0.02em; margin-bottom:14px;}
  .sub{font-size:15px; color:var(--grey-mid); line-height:1.6; max-width:440px; margin:0 auto 36px;}

  .card{
    background:var(--cream-2); border-radius:18px; padding:22px 24px; margin-bottom:32px;
    text-align:left; font-size:13.5px; color:var(--grey-mid); line-height:1.7;
  }
  .card b{color:var(--charcoal);}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--red); color:var(--cream);
    font-weight:700; font-size:14px;
    padding:14px 26px; border-radius:100px;
    border:1px solid var(--red);
    margin:0 8px 8px;
  }
  .btn.ghost{background:transparent; color:var(--charcoal); border-color:var(--charcoal);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#FBF7F0" stroke-width="1.6"/><path d="M12 3v9l6 3" stroke="#FBF7F0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    PIZZA LAB
  </div>

  <div id="content"></div>

  <div style="margin-top:8px;">
    <a href="index.html" class="btn ghost">Volver a la web</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = (params.get('status') || params.get('collection_status') || 'pendiente').toLowerCase();

  const STATES = {
    aprobado: {
      icon: 'ok',
      svg: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#FBF7F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      title: '¡Pedido confirmado!',
      sub: 'Tu pago se acreditó correctamente. Preparamos tu pizza fresca y te la entregamos el próximo miércoles.',
      card: 'Vas a recibir la confirmación por Mercado Pago. Cualquier duda sobre tu pedido, escribinos por WhatsApp con tu nombre y el número de operación.'
    },
    approved: null,
    rechazado: {
      icon: 'fail',
      svg: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#FBF7F0" stroke-width="2.4" stroke-linecap="round"/></svg>',
      title: 'No pudimos procesar el pago',
      sub: 'Algo falló al confirmar tu pago con Mercado Pago. No te preocupes, no se te cobró nada.',
      card: 'Podés volver al carrito e intentar de nuevo, probando con otro medio de pago si el problema persiste.'
    },
    rejected: null,
    pendiente: {
      icon: 'pending',
      svg: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#FBF7F0" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#FBF7F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      title: 'Tu pago está pendiente',
      sub: 'Mercado Pago todavía está procesando tu pago (esto pasa con algunos medios de pago, como transferencias o efectivo).',
      card: 'Apenas se acredite el pago vas a recibir la confirmación. Si en unas horas seguís sin novedades, escribinos por WhatsApp.'
    },
    in_process: null,
  };
  STATES.approved = STATES.aprobado;
  STATES.rejected = STATES.rechazado;
  STATES.in_process = STATES.pendiente;

  const s = STATES[status] || STATES.pendiente;

  document.getElementById('content').innerHTML = `
    <div class="icon ${s.icon}">${s.svg}</div>
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    <div class="card">${s.card}</div>
  `;
</script>
</body>
</html>
