<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fina Protein Lab — Tu pedido</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#241A17;
    --cream:#F6F1E6;
    --cream-2:#EFE6D2;
    --red:#822D2C;
    --red-dark:#641F1F;
    --green:#5C6B4A;
    --amber:#B7791F;
    --grey-mid:rgba(36,26,23,0.62);
    --line:rgba(36,26,23,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--charcoal); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px; margin:0 auto; padding:60px 24px 80px; text-align:center;}
  h1,h2,.display{font-family:'Archivo', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit; text-decoration:none;}

  .logo{display:flex; align-items:center; justify-content:center; gap:11px; font-size:17px; font-weight:800; margin-bottom:52px;}
  .mark{width:34px; height:34px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .mark svg{width:19px; height:19px;}

  .icon{
    width:76px; height:76px; border-radius:50%; margin:0 auto 26px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon.ok{background:var(--green);}
  .icon.fail{background:var(--red);}
  .icon.pending{background:var(--amber);}

  h1{font-size:clamp(26px,4vw,34px); font-weight:800; letter-spacing:-0.02em; margin-bottom:14px;}
  .sub{font-size:15px; color:var(--grey-mid); line-height:1.6; max-width:440px; margin:0 auto 36px;}

  .card{
    background:var(--cream-2); border-radius:18px; padding:22px 24px; margin-bottom:32px;
    text-align:left; font-size:13.5px; color:var(--grey-mid); line-height:1.7;
  }
  .card b{color:var(--charcoal);}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--red); color:var(--cream);
    font-weight:700; font-size:14px;
    padding:14px 26px; border-radius:100px;
    border:1px solid var(--red);
    margin:0 8px 8px;
  }
  .btn.ghost{background:transparent; color:var(--charcoal); border-color:var(--charcoal);}

  /* ===== NUEVO BRANDING ===== */
  :root{--cream:#F4EEE2;--cream-2:#EBE2D0;--charcoal:#2a1d19;--red-dark:#5f1d1d;--line:rgba(42,29,25,.2);--grey-mid:rgba(42,29,25,.62)}
  body{font-family:'Poppins',sans-serif;font-weight:300}
  h1,h2,.display{font-family:'Lora',serif;font-weight:400}
  .mono{font-family:'Lora',serif}
  .logo{font-family:'Lora',serif;font-weight:400;font-size:26px;letter-spacing:-.01em;color:var(--red);gap:14px}
  .logo img{width:44px;display:block}
  .pill-btn,.pay-btn,.btn{font-family:'Poppins',sans-serif;font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase}

  .wrap{max-width:640px}
  .logo{justify-content:center;margin-bottom:56px}
  h1{font-size:clamp(38px,6vw,58px);letter-spacing:-.03em;line-height:1.05}
  .sub{font-weight:300;line-height:1.8}
  .card{background:transparent;border:1px solid var(--line);border-radius:28px;padding:28px 30px;font-weight:300}
  .card b{font-weight:500}
  .btn{background:var(--red);border:1px solid var(--red);padding:16px 30px}
  .btn.ghost{background:transparent;color:var(--red);border-color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="mascot.png" alt="">Fina Protein Lab</div>

  <div id="content"></div>

  <div style="margin-top:8px;">
    <a href="index.html" class="btn ghost">Volver a la web</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const status = (params.get('status') || params.get('collection_status') || 'pendiente').toLowerCase();

  const STATES = {
    aprobado: {
      icon: 'ok',
      svg: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#F6F1E6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      title: '¡Pedido confirmado!',
      sub: 'Tu pago se acreditó correctamente. Ya estamos preparando tu pedido.',
      card: 'Te va a llegar un correo de confirmación, con los detalles de tu compra, al mail que tenés registrado en Mercado Pago.'
    },
    approved: null,
    rechazado: {
      icon: 'fail',
      svg: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#F6F1E6" stroke-width="2.4" stroke-linecap="round"/></svg>',
      title: 'No pudimos procesar el pago',
      sub: 'Algo falló al confirmar tu pago con Mercado Pago. No te preocupes, no se te cobró nada.',
      card: 'Podés volver al carrito e intentar de nuevo, probando con otro medio de pago si el problema persiste.'
    },
    rejected: null,
    pendiente: {
      icon: 'pending',
      svg: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#F6F1E6" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#F6F1E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      title: 'Tu pago está pendiente',
      sub: 'Mercado Pago todavía está procesando tu pago (esto pasa con algunos medios de pago, como transferencias o efectivo).',
      card: 'Apenas se acredite el pago vas a recibir la confirmación. Si en unas horas seguís sin novedades, escribinos por WhatsApp.'
    },
    in_process: null,
  };
  STATES.approved = STATES.aprobado;
  STATES.rejected = STATES.rechazado;
  STATES.in_process = STATES.pendiente;

  const s = STATES[status] || STATES.pendiente;

  document.getElementById('content').innerHTML = `
    <div class="icon ${s.icon}">${s.svg}</div>
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>
    <div class="card">${s.card}</div>
  `;

</script>

</body>
</html>
